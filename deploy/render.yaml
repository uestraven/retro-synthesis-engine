# Render blueprint for the generation API.
#
# The wildcard bind lives HERE, not in the application's defaults. The service
# runs inside a container whose only published port is the one Render routes
# to, so binding every interface inside that container is how the platform
# reaches it -- but it is a deployment decision, visible in the deployment
# file, rather than a default that ships in the repository and silently
# exposes anyone who runs the service on a laptop or a shared host.
services:
  - type: web
    name: rse-api
    runtime: python
    plan: starter
    buildCommand: pip install -e ".[api]"
    # PORT is injected by Render; rse.api.settings honours it.
    startCommand: uvicorn rse.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Pinned, not left to the platform default. pyproject declares
      # requires-python = ">=3.11,<3.13", so a runner defaulting to 3.13
      # fails the install outright with "package requires a different
      # Python" -- a build failure with nothing wrong in the code. 3.12 is
      # the newest version the constraint allows.
      - key: PYTHON_VERSION
        value: "3.12"
      - key: RSE_API_HOST
        value: 0.0.0.0
      # Sized by the PLATFORM REQUEST TIMEOUT, which is the binding
      # constraint and was not when this file was written.
      #
      # The old comment here said 180 s of music is ~3.6 s of CPU. That was
      # the NES renderer. The SNES sampler is three orders of magnitude more
      # expensive -- measured at 0.67-0.77x realtime, so 115 s of audio takes
      # 82 s to render on a build host with a full core. Generation is
      # synchronous inside the HTTP request, so render time IS request time,
      # and Render's load balancer closes a request at 100 s.
      #
      # At 180 s the longest SNES songs would therefore 502, and the 16-bit
      # option would look broken in production rather than slow. 60 s of
      # audio is ~42 s of render here, leaving room for a host slower than
      # this one.
      #
      # VERIFY THIS ON THE REAL INSTANCE. The headroom assumes the starter
      # plan is within ~2x of a full core, which is a guess, not a
      # measurement. If a 60 s SNES request completes well inside the
      # timeout there, raise this; if it times out, lower it. The honest fix
      # is asynchronous generation with a job id, which is a feature and not
      # part of this deploy.
      - key: RSE_API_MAX_SECONDS
        value: "60"
      - key: RSE_API_MIN_SECONDS
        value: "8"
      # The starter plan is a fraction of a core, and two concurrent SNES
      # renders contend for it -- which makes each one slower and pushes both
      # toward the request timeout above. Two is a throughput-versus-latency
      # choice; drop it to 1 if SNES requests start timing out under load,
      # since a queued request that succeeds beats two that 502.
      - key: RSE_API_MAX_CONCURRENT
        value: "2"
      - key: RSE_API_RATE_PER_MINUTE
        value: "20"
      - key: RSE_API_RATE_BURST
        value: "5"
      # Long enough to find the tab again and download; short enough that the
      # disk arithmetic below stays small.
      - key: RSE_API_RETENTION_SECONDS
        value: "900"
      # Sized by DISK, not by traffic, and the number changed when SNES
      # shipped. Measured from a real render: stereo SNES audio is
      # 0.176 MB/s, so a song at the 60 s cap above is 10.6 MB and 40 of them
      # is 0.42 GB of ephemeral disk.
      #
      # The old value of 200 was set when NES mono was the only output. With
      # stereo SNES at the old 180 s cap it allowed 6.35 GB -- enough to fill
      # the instance and take the service down.
      #
      # The cost of a smaller number is that a download link can be evicted
      # early under load. That is the better failure: a dead link is an
      # annoyance, a full disk is an outage.
      - key: RSE_API_MAX_STORED_SONGS
        value: "40"
      # The public site's origin. Set this to the real frontend origin before
      # the site goes live; empty means same-origin only, and the API refuses
      # to guess. Never "*".
      - key: RSE_API_ALLOWED_ORIGINS
        sync: false
