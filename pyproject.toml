[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-synthesis-engine"
version = "0.1.0.dev0"
description = "Symbolic music generation for vintage game-console sound hardware"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# Ingestion and rendering run on these alone. Everything heavier is an extra so
# the pipeline stays installable on a machine with no GPU. NumPy is required,
# not optional: the CLI imports the renderer.
dependencies = [
    "mido>=1.3,<2",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Phase 4 model training. Pinned to >=3.11,<3.13 by torch/miditok wheel support.
ml = [
    "numpy>=1.26",
    "torch>=2.2",
    "miditok>=3.0",
    "symusic>=0.5",
]
# Phase 5 local UI.
ui = ["gradio>=4.44"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
rse = "rse.cli:main"

[tool.setuptools.packages.find]
include = ["rse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Every script inserts the repository root on sys.path before importing `rse`,
# so that `python scripts/x.py` works on a checkout where the package is not
# installed -- the normal state of a fresh GPU host. The imports cannot
# precede that by construction.
"scripts/*.py" = ["E402"]
